<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#2F4053"
  >

  <title>دفتر المشارك التفاعلي</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --primary: #2F4053;
      --primary-dark: #233140;
      --gold: #7B6F5A;
      --gold-light: #A6947A;
      --sand: #F4F1EC;
      --text: #27313D;
      --muted: #6B7280;
      --background: #FAFAF8;
      --border: #E5E7EB;
      --white: #FFFFFF;
      --success: #2F6B54;
      --danger: #A04444;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Tajawal", sans-serif;
      line-height: 1.75;
    }

    .container {
      max-width: 980px;
      margin: auto;
      padding: 18px 16px 70px;
    }

    .hero {
      background: linear-gradient(
        135deg,
        var(--primary-dark),
        var(--primary)
      );

      color: white;
      border-radius: 28px;
      padding: 28px 24px;

      box-shadow:
        0 14px 38px
        rgba(35, 49, 64, 0.12);

      margin-bottom: 16px;
    }

    .hero small {
      color: #e7dfd5;
      font-weight: 700;
    }

    .hero h1 {
      margin: 6px 0 4px;
      font-size: clamp(
        1.55rem,
        4vw,
        2.45rem
      );
    }

    .hero p {
      margin: 0;
      color: #f2eee9;
    }

    .card {
      background: var(--white);

      border:
        1px solid
        var(--border);

      border-radius: 20px;

      padding: 20px;
      margin: 14px 0;

      box-shadow:
        0 8px 24px
        rgba(35, 49, 64, 0.05);
    }

    h2,
    h3 {
      color: var(--primary);
    }

    label {
      font-weight: 700;
      display: block;
      margin: 12px 0 7px;
    }

    input,
    textarea {

      width: 100%;

      border:
        1px solid
        #d7dce1;

      border-radius: 12px;

      padding: 12px 13px;

      font: inherit;

      background: white;

      color: var(--text);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {

      outline:
        2px solid
        rgba(123, 111, 90, 0.20);

      border-color:
        var(--gold);
    }

    .button {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 6px;

      border: none;

      border-radius: 12px;

      padding: 11px 16px;

      background:
        var(--primary);

      color: white;

      font-weight: 800;

      cursor: pointer;

      font-family: inherit;
    }

    .button.secondary {
      background:
        var(--gold);
    }

    .button.outline {

      background: white;

      color:
        var(--primary);

      border:
        1px solid
        var(--border);
    }

    .button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hidden {
      display: none !important;
    }

    .muted {
      color:
        var(--muted);
    }

    .error {
      color:
        var(--danger);

      font-weight: 700;
    }

    .success {
      color:
        var(--success);

      font-weight: 800;
    }

    .topbar {

      display: flex;

      justify-content:
        space-between;

      align-items:
        center;

      gap: 10px;

      flex-wrap:
        wrap;
    }

    .participant {

      background:
        var(--sand);

      padding:
        7px 12px;

      border-radius:
        999px;

      font-weight:
        700;
    }

    .steps {

      display: flex;

      gap: 8px;

      overflow-x: auto;

      padding:
        10px 0 14px;
    }

    .step {

      min-width: 46px;

      height: 46px;

      border-radius:
        50%;

      border:
        1px solid
        var(--border);

      display:
        grid;

      place-items:
        center;

      background:
        white;

      font-weight:
        800;

      cursor:
        pointer;
    }

    .step.current {

      background:
        var(--primary);

      color:
        white;
    }

    .step.done {

      border-color:
        var(--success);

      color:
        var(--success);
    }

    .step.locked {

      opacity:
        0.35;

      cursor:
        not-allowed;
    }

    .notice {

      background:
        var(--sand);

      border-right:
        4px solid
        var(--gold);

      padding:
        12px 14px;

      border-radius:
        12px;

      margin-bottom:
        18px;
    }

    .question {

      padding:
        16px 0;

      border-bottom:
        1px solid
        var(--border);
    }

    .question:last-child {
      border-bottom: none;
    }

    .scale {

      display: grid;

      grid-template-columns:
        repeat(5, 1fr);

      gap: 7px;

      margin-top:
        10px;
    }

    .choice {

      border:
        1px solid
        var(--border);

      border-radius:
        11px;

      padding:
        9px 6px;

      text-align:
        center;

      font-weight:
        500;

      cursor:
        pointer;
    }

    .choice input {

      width:
        auto;

      margin-left:
        5px;
    }

    .grid {

      display:
        grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap:
        10px;
    }

    .result-card {

      background:
        var(--sand);

      border-radius:
        15px;

      padding:
        15px;
    }

    .score {

      font-size:
        2rem;

      font-weight:
        800;

      color:
        var(--primary);
    }

    .bar {

      height:
        9px;

      border-radius:
        999px;

      background:
        #e7e2da;

      overflow:
        hidden;

      margin:
        8px 0;
    }

    .bar span {

      display:
        block;

      height:
        100%;

      background:
        var(--gold);
    }

    .bar span.band-high {
      background: var(--primary);
    }

    .bar span.band-mid {
      background: var(--gold-light);
    }

    .bar span.band-low {
      background: #cbbfae;
    }

    .dimension-title {
      margin: 22px 0 0;
      padding: 8px 12px;
      background: var(--sand);
      border-radius: 10px;
      font-size: 1.05rem;
    }

    .key-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.95rem;
    }

    .key-table th,
    .key-table td {
      border: 1px solid var(--border);
      padding: 8px 10px;
      text-align: right;
      vertical-align: top;
    }

    .key-table th {
      background: var(--primary);
      color: white;
    }

    .ideas {
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin: 10px 0 4px;
      background: var(--background);
    }

    .ideas-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0 10px;
    }

    .ideas-tab {
      border: 1px solid var(--border);
      background: white;
      color: var(--primary);
      border-radius: 999px;
      padding: 5px 12px;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
    }

    .ideas-tab.active {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .idea {
      display: block;
      width: 100%;
      text-align: right;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: white;
      padding: 9px 12px;
      margin: 6px 0;
      font: inherit;
      color: var(--text);
      cursor: pointer;
    }

    .idea:hover,
    .idea:focus-visible {
      border-color: var(--gold);
      background: var(--sand);
    }

    .idea small {
      display: block;
      color: var(--muted);
      font-size: 0.85rem;
    }

    .activity-number {

      color:
        var(--gold);

      font-weight:
        800;
    }

    .actions {

      display:
        flex;

      gap:
        8px;

      flex-wrap:
        wrap;

      margin-top:
        16px;
    }

    .method-note {

      color:
        var(--muted);

      font-size:
        0.92rem;

      margin-top:
        18px;
    }

    @media (
      max-width: 700px
    ) {

      .grid,
      .scale {

        grid-template-columns:
          1fr;
      }

      .choice {
        text-align:
          right;
      }

      .topbar {

        align-items:
          stretch;
      }

      .actions .button,
      .topbar .button {

        width:
          100%;
      }

    }

  </style>

</head>


<body>

<main class="container">

  <header class="hero">

    <small>
      دفتر المشارك الإلكتروني
    </small>

    <h1>
      رشاقة الأداء المؤسسي
      في قطاع الأوقاف
    </h1>

    <p>
      من المهام اليومية
      إلى الأثر المستدام
    </p>

  </header>


  <!-- شاشة الدخول -->

  <section
    id="loginScreen"
    class="card"
  >

    <h2>
      ابدأ دفتر الأنشطة
    </h2>

    <p class="muted">

      سجّل بياناتك مرة واحدة،
      ثم ستظهر لك الأنشطة
      التي يفتحها المدرب.

    </p>


    <label for="participantName">

      الاسم *

    </label>

    <input
      id="participantName"
      autocomplete="name"
      placeholder="اكتب اسمك"
    >


    <label for="participantEmail">

      البريد الإلكتروني *

    </label>

    <input
      id="participantEmail"
      type="email"
      autocomplete="email"
      placeholder="name@example.com"
    >


    <div class="actions">

      <button
        id="loginButton"
        class="button"
        type="button"
      >

        دخول الدفتر

      </button>

    </div>


    <p
      id="loginMessage"
      class="muted"
    ></p>

  </section>



  <!-- التطبيق -->

  <section
    id="workbookApp"
    class="hidden"
  >


    <div class="topbar">

      <div
        id="currentParticipant"
        class="participant"
      ></div>


      <div class="actions">

        <button
          id="refreshButton"
          class="button outline"
          type="button"
        >

          تحديث

        </button>


        <button
          id="downloadButton"
          class="button secondary"
          type="button"
        >

          تحميل الدفتر الكامل

        </button>

      </div>

    </div>



    <nav
      id="activitySteps"
      class="steps"
    ></nav>



    <section class="card">

      <div
        id="activityStatus"
        class="notice"
      ></div>


      <div
        id="activityContent"
      ></div>

    </section>


  </section>


</main>

/* ========================================

   تنظيف النصوص

======================================== */


function escapeHtml(value) {

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  );

}



/* ========================================

   استدعاء API

======================================== */


async function apiCall(body) {


  const response = await fetch(

    API_URL,

    {

      method:
        "POST",

      headers: {

        "Content-Type":
          "application/json"

      },

      body:
        JSON.stringify(body)

    }

  );


  let data = {};


  try {

    data =
      await response.json();

  } catch {}


  if (!response.ok) {

    throw new Error(

      data.error ||

      data.message ||

      "تعذر الاتصال بالنظام."

    );

  }


  return data;

}



/* ========================================

   تفسير الدرجات

======================================== */


function interpretScore(score) {


  if (score >= 17) {

    return [

      "ممارسة راسخة",

      "حافظ عليها، وانقلها إلى زملائك وفريقك."

    ];

  }


  if (score >= 12) {

    return [

      "ممارسة موجودة لكنها غير منتظمة",

      "اجعلها عادة: موعد ثابت، ومسؤول واضح، وأداة بسيطة."

    ];

  }


  return [

    "فرصة تحسين أولى",

    "ابدأ منها في عيادة الرشاقة بأصغر تحسين ممكن."

  ];

}



/* ========================================

   حساب الاستبانة

======================================== */


function calculateAssessment(
  answers
) {


  const values = [];


  for (
    let i = 1;
    i <= 16;
    i++
  ) {

    values.push(

      Number(
        answers["q" + i]
      )

    );

  }


  const dimensions =

    dimensionNames.map(

      (
        name,
        index
      ) => {


        const score =

          values

          .slice(
            index * 4,
            index * 4 + 4
          )

          .reduce(
            (a, b) => a + b,
            0
          );


        const [

          label,

          advice

        ] = interpretScore(
          score
        );


        return {

          name,

          score,

          label,

          advice

        };

      }

    );


  // عند تساوي درجتين أو أكثر تُذكر الأبعاد المتساوية كلها

  const scores =
    dimensions.map(
      item => item.score
    );


  const namesWithScore = score =>

    dimensions

    .filter(
      item =>
        item.score === score
    )

    .map(
      item => item.name
    )

    .join(" و");


  return {

    total:

      dimensions.reduce(
        (total, item) =>
          total + item.score,
        0
      ),

    maxTotal:
      80,

    dimensions,

    strongest:
      namesWithScore(
        Math.max(...scores)
      ),

    weakest:
      namesWithScore(
        Math.min(...scores)
      )

  };

}

async function login() {


  const name =

    getElement(
      "participantName"
    ).value.trim();


  const email =

    getElement(
      "participantEmail"
    ).value.trim();


  const message =

    getElement(
      "loginMessage"
    );


  if (
    !name ||
    !email
  ) {

    message.className =
      "error";

    message.textContent =

      "الاسم والبريد الإلكتروني مطلوبان.";

    return;

  }


  message.className =
    "muted";


  message.textContent =
    "جارٍ الدخول...";


  try {


    const result =

      await apiCall({

        action:
          "register",

        name,

        email

      });


    accessToken =
      result.token;


    localStorage.setItem(

      "waqf_workbook_token",

      accessToken

    );


    await loadStatus();


  } catch (error) {


    message.className =
      "error";


    message.textContent =

      "تعذر الدخول: " +
      error.message;

  }

}

  try {

    getElement(
      "loginScreen"
    ).classList.add(

    getElement(

    ).classList.remove(

    );

    getElement(

/* ========================================

   عرض الأنشطة

======================================== */


function render() {


  const saved =
    savedResponses();


  const steps =

    getElement(
      "activitySteps"
    );


  steps.innerHTML = "";


  (
    appState.activities || []
  ).forEach(

    activity => {


      const button =

        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "step";


      if (
        Number(activity.id) ===
        Number(currentActivity)
      ) {

        button.classList.add(
          "current"
        );

      }


      if (
        saved[activity.id]
      ) {

        button.classList.add(
          "done"
        );

      }


      if (
        !activity.is_open
      ) {

        button.classList.add(
          "locked"
        );

      }


      button.textContent =

        saved[activity.id]
        ? "✓"
        : activity.id;


      button.title =
        activity.title;


      if (
        activity.is_open
      ) {


        button.onclick = () => {


          currentActivity =
            Number(activity.id);


          render();

        };

      }


      steps.appendChild(
        button
      );

    }

  );


  const activity =

    (
      appState.activities || []
    )

    .find(

      item =>

        Number(item.id) ===
        Number(currentActivity)

    );


  if (!activity) {

    getElement(
      "activityContent"
    ).innerHTML =

      "<p>لا يوجد نشاط متاح حاليًا.</p>";

    return;

  }


  getElement(
    "activityStatus"
  ).innerHTML =

    activity.is_open

    ? "<b>النشاط " +
      activity.id +
      " مفتوح الآن.</b>"

    : "هذا النشاط غير مفتوح حاليًا. انتظر توجيه المدرب.";



  if (
    Number(activity.id) === 1
  ) {


    renderAssessment(
      saved[1],
      activity.is_open
    );


  } else {


    renderRegularActivity(

      activity,

      saved[activity.id]

    );

  }

}

    "saveAssessmentButton"

/* ========================================

   حفظ الاستبانة

======================================== */


async function saveAssessment() {


  const answers = {};


  const message =

    getElement(
      "saveMessage"
    );


  for (
    let i = 1;
    i <= 16;
    i++
  ) {


    const selected =

      document.querySelector(

        `input[name="q${i}"]:checked`

      );


    if (!selected) {


      message.className =
        "error";


      message.textContent =

        "أجب عن جميع العبارات أولًا.";


      return;

    }


    answers[
      "q" + i
    ] =

      Number(
        selected.value
      );

  }


  const result =

    calculateAssessment(
      answers
    );


  answers._result =
    result;


  message.className =
    "muted";


  message.textContent =
    "جارٍ الحفظ...";


  try {


    await apiCall({

      action:
        "save",

      token:
        accessToken,

      activity_id:
        1,

      answers

    });


    await loadStatus();


  } catch (error) {


    message.className =
      "error";


    message.textContent =

      "تعذر الحفظ: " +
      error.message;

  }

}



/* ========================================

   شاشة نتيجة الاستبانة

======================================== */


function bandClass(score) {

  if (score >= 17) {
    return "band-high";
  }

  if (score >= 12) {
    return "band-mid";
  }

  return "band-low";

}



function renderAssessmentResult(
  answers,
  isOpen
) {


  const result =
    answers._result;


  const next =
    answers._next || {};


  getElement(
    "activityStatus"
  ).innerHTML =

    "<b>اكتملت المهمة الأولى ✓</b>";



  const cards =

    result.dimensions

    .map(

      item => `

        <div class="result-card">

          <b>
            ${escapeHtml(item.name)}
          </b>


          <div class="score">

            ${item.score}
            /
            20

          </div>


          <div class="bar">

            <span
              class="${bandClass(item.score)}"
              style="width:${(item.score / 20) * 100}%"
            ></span>

          </div>


          <b>

            ${escapeHtml(
              item.label
            )}

          </b>


          <div class="muted">

            ${escapeHtml(
              item.advice
            )}

          </div>

        </div>

      `

    )

    .join("");



  const keyRows =

    scoreKey

    .map(

      row => `

        <tr>

          <td><b>${row[0]}</b></td>

          <td>${escapeHtml(row[1])}</td>

          <td>${escapeHtml(row[2])}</td>

        </tr>

      `

    )

    .join("");



  const disabled =

    isOpen
    ? ""
    : "disabled";



  getElement(
    "activityContent"
  ).innerHTML = `


    <h2>
      نتيجتك في استبانة الرشاقة
    </h2>


    <div
      class="result-card"
      style="text-align:center"
    >


      <div class="score">

        ${result.total}
        /
        80

      </div>


      <div>

        المجموع الكلي

      </div>


    </div>



    <div
      class="grid"
      style="margin-top:10px"
    >

      ${cards}

    </div>



    <h3>
      اقرأ نتيجتك
    </h3>


    <table class="key-table">

      <thead>

        <tr>

          <th>درجة البعد</th>

          <th>القراءة</th>

          <th>ماذا تفعل؟</th>

        </tr>

      </thead>

      <tbody>

        ${keyRows}

      </tbody>

    </table>



    <h3>
      خطوتي التالية
    </h3>


    <div class="notice">

      <b>
        أقوى بُعد عندي:
      </b>

      ${escapeHtml(
        result.strongest
      )}

      <br>

      <b>
        أضعف بُعد عندي:
      </b>

      ${escapeHtml(
        result.weakest
      )}

    </div>


    <label for="nextImprovement">

      أصغر تحسين سأجربه فيه خلال أسبوعين

    </label>


    <p class="muted" style="margin:0">

      التحسين الجيد صغير ومحدد،
      تستطيع تجربته خلال أسبوعين
      دون انتظار موافقات كثيرة.
      اختر اقتراحًا ثم عدّله ليناسب عملك،
      أو اكتب تحسينك بنفسك.

    </p>


    ${isOpen
      ? '<div id="ideasBox" class="ideas"></div>'
      : ""}

    <textarea
      id="nextImprovement"
      ${disabled}
    >${escapeHtml(next.improvement || "")}</textarea>


    <label for="nextMeasure">

      كيف سأعرف أنه نجح؟

    </label>

    <textarea
      id="nextMeasure"
      ${disabled}
    >${escapeHtml(next.measure || "")}</textarea>


    <div class="actions">

      <button
        id="saveNextButton"
        class="button"
        type="button"
        ${disabled}
      >

        ${next.improvement || next.measure
          ? "تحديث خطوتي التالية"
          : "حفظ خطوتي التالية"}

      </button>

    </div>


    <p
      id="saveMessage"
    ></p>


    <p class="method-note">

  ) {

    getElement(
      "saveNextButton"
    ).onclick = () =>

      );


    // الأبعاد مرتبة من الأضعف إلى الأقوى

    const ordered =

      [...result.dimensions]

      .sort(
        (a, b) =>
          a.score - b.score
      )

      .map(
        item => item.name
      )

      .filter(
        name =>
          improvementIdeas[name]
      );


    if (ordered.length) {

      renderIdeas(
        ordered,
        ordered[0]

}



/* ========================================

   عرض اقتراحات التحسين

======================================== */


function renderIdeas(
  ordered,
  selected
) {


  const box =
    getElement(
      "ideasBox"
    );


  const tabs =

    ordered

    .map(

      (name, index) => `

        <button
          type="button"
          class="ideas-tab ${name === selected ? "active" : ""}"
          data-dimension="${escapeHtml(name)}"
        >

          ${escapeHtml(name)}${index === 0 ? " (الأولوية)" : ""}

        </button>

      `

    )

    .join("");


  const ideas =

    improvementIdeas[selected]

    .map(

      (idea, index) => `

        <button
          type="button"
          class="idea"
          data-index="${index}"
        >

          ${index + 1}.
          ${escapeHtml(idea[0])}

          <small>
            مؤشر النجاح:
            ${escapeHtml(idea[1])}
          </small>

        </button>

      `

    )

    .join("");


  box.innerHTML = `

    <b>
      اقتراحات لبُعد «${escapeHtml(selected)}»
    </b>

    <div class="muted" style="font-size:.9rem">

      بدأنا بأضعف بُعد عندك؛
      ويمكنك عرض اقتراحات بقية الأبعاد.

    </div>

    <div class="ideas-tabs">
      ${tabs}
    </div>

    ${ideas}

  `;


  box.querySelectorAll(
    ".ideas-tab"
  ).forEach(

    tab => {

      tab.onclick = () =>

        renderIdeas(
          ordered,
          tab.dataset.dimension
        );

    }

  );


  box.querySelectorAll(
    ".idea"
  ).forEach(

    button => {

      button.onclick = () =>

        useIdea(
          improvementIdeas[selected][
            Number(button.dataset.index)
          ]
        );

    }

  );

}



/* ========================================

   نقل الاقتراح إلى الحقلين

======================================== */


function useIdea(idea) {


  const improvement =
    getElement(
      "nextImprovement"
    );


  const measure =
    getElement(
      "nextMeasure"
    );


  // لا نستبدل نصًا كتبه المشارك بنفسه دون سؤاله

  const suggested =

    Object.values(
      improvementIdeas
    )

    .flat(2);


  const ownText =

    [improvement, measure]

    .some(

      field =>

        field.value.trim() &&
        !suggested.includes(
          field.value.trim()
        )

    );


  if (
    ownText &&
    !confirm(
      "سيُستبدل ما كتبته بهذا الاقتراح. هل تريد المتابعة؟"
    )
  ) {

    return;

  }


  improvement.value =
    idea[0];


  measure.value =
    idea[1];


  improvement.focus();

}



/* ========================================

   حفظ خطوتي التالية

======================================== */


async function saveNextStep(
  answers
) {


  const message =

    getElement(
      "saveMessage"
    );


  const updated = {

    ...answers,

    _next: {

      improvement:
        getElement(
          "nextImprovement"
        ).value.trim(),

      measure:
        getElement(
          "nextMeasure"
        ).value.trim()

    }

  };


  message.className =
    "muted";


  message.textContent =
    "جارٍ الحفظ...";


  try {


    await apiCall({

      action:
        "save",

      token:
        accessToken,

      activity_id:
        1,

      answers:
        updated

    });


    await loadStatus();


    const saved =
      getElement(
        "saveMessage"
      );


    if (saved) {

      saved.className =
        "success";

      saved.textContent =
        "✓ تم الحفظ";

    }


  } catch (error) {


    message.className =
      "error";


    message.textContent =

      "تعذر الحفظ: " +
      error.message;

  }

}



/* ========================================

   عرض الأنشطة 2–8

======================================== */


function renderRegularActivity(
  activity,
  saved
) {


  const definition =

    activityDefinitions[
      activity.id
    ];


  if (!definition) {


    getElement(
      "activityContent"
    ).innerHTML =

      "<p class='error'>تعذر العثور على تعريف النشاط.</p>";


    return;

  }


  const existing =

    saved?.answers || {};


  let html = `

    <div class="activity-number">

      النشاط
      ${activity.id}

    </div>


    <h2>

      ${escapeHtml(
        definition.title
      )}

    </h2>


    <p class="muted">

      ${escapeHtml(
        definition.help
      )}

    </p>

  `;



  definition.fields.forEach(

    field => {


      html += `

        <label
          for="field_${field[0]}"
        >

          ${escapeHtml(
            field[1]
          )}

        </label>


        <textarea
          id="field_${field[0]}"
          ${activity.is_open
            ? ""
            : "disabled"}
        >${escapeHtml(
          existing[
            field[0]
          ] || ""
        )}</textarea>

      `;

    }

  );


  html += `

    <div class="actions">

      <button
        id="saveRegularButton"
        class="button"
        type="button"

        ${activity.is_open
          ? ""
          : "disabled"}
      >

        ${saved
          ? "تحديث المشاركة"
          : "حفظ وإرسال"}

      </button>

    </div>


    <p
      id="saveMessage"
    ></p>

  `;


  getElement(
    "activityContent"
  ).innerHTML =
    html;


  if (
    activity.is_open
  ) {


    getElement(
      "saveRegularButton"
    ).onclick = () =>

      saveRegularActivity(
        activity.id
      );

  }

}



/* ========================================

   حفظ نشاط عادي

======================================== */


async function saveRegularActivity(
  activityId
) {


  const definition =

    activityDefinitions[
      activityId
    ];


  const answers = {};


  definition.fields.forEach(

    field => {


      answers[
        field[0]
      ] =

        getElement(
          "field_" +
          field[0]
        ).value.trim();

    }

  );


  const message =

    getElement(
      "saveMessage"
    );


  message.className =
    "muted";


  message.textContent =
    "جارٍ الحفظ...";


  try {


    await apiCall({

      action:
        "save",

      token:
        accessToken,

      activity_id:
        activityId,

      answers

    });


    message.className =
      "success";


    message.textContent =
      "✓ تم الحفظ";


    await loadStatus();


  } catch (error) {


    message.className =
      "error";


    message.textContent =

      "تعذر الحفظ: " +
      error.message;

  }

}



/* ========================================

   تحميل الدفتر الكامل

======================================== */


async function downloadWorkbook() {


  try {


    const data =

      await apiCall({

        action:
          "status",

        token:
          accessToken

      });


    const savedMap = {};


    (
      data.saved || []
    ).forEach(

      response => {

        savedMap[
          response.activity_id
        ] = response;

      }

    );


    let output = `

      <!doctype html>

      <html
        lang="ar"
        dir="rtl"
      >

      <meta charset="utf-8">

      <title>
        دفتر المشارك الكامل
      </title>


      <style>

        body {

          font-family:
            Arial,
            sans-serif;

          max-width:
            900px;

          margin:
            40px auto;

          line-height:
            1.8;

          color:
            #27313D;

        }

        h1,
        h2,
        h3 {

          color:
            #2F4053;

        }

        .box {

          border:
            1px solid #ddd;

          border-radius:
            12px;

          padding:
            16px;

          margin:
            14px 0;

        }

      </style>


      <h1>

        دفتر المشارك الكامل

      </h1>


      <p>

        ${escapeHtml(
          data.participant.name
        )}

        —

        ${escapeHtml(
          data.participant.email
        )}

      </p>

    `;



    for (
      const activity
      of data.activities
    ) {


      const saved =

        savedMap[
          activity.id
        ];


      if (!saved) {

        continue;

      }


      output += `

        <div class="box">

          <h2>

            ${escapeHtml(
              activity.title
            )}

          </h2>

      `;



      if (

        Number(
          activity.id
        ) === 1

        &&

        saved.answers?._result

      ) {


        const result =

          saved.answers._result;


        output += `

          <h3>

            المجموع:

            ${result.total}

            /

            80

          </h3>

        `;



        result.dimensions.forEach(

          dimension => {


            output += `

              <p>

                <b>

                  ${escapeHtml(
                    dimension.name
                  )}

                  :

                  ${dimension.score}
                  /
                  20

                  —

                  ${escapeHtml(
                    dimension.label
                  )}

                </b>

                <br>

                ${escapeHtml(
                  dimension.advice
                )}

              </p>

            `;

          }

        );


        output += `

          <p>

            <b>
              أقوى بُعد:
            </b>

            ${escapeHtml(
              result.strongest
            )}

          </p>


          <p>

            <b>
              أضعف بُعد:
            </b>

            ${escapeHtml(
              result.weakest
            )}

          </p>


          <h3>
            خطوتي التالية
          </h3>


          <p>

            <b>
              أصغر تحسين سأجربه فيه خلال أسبوعين:
            </b>

            <br>

            ${escapeHtml(
              saved.answers._next?.improvement || ""
            )}

          </p>


          <p>

            <b>
              كيف سأعرف أنه نجح؟
            </b>

            <br>

            ${escapeHtml(
              saved.answers._next?.measure || ""
            )}

          </p>


          <h3>
            إجابات الاستبانة
          </h3>

        `;



        assessmentQuestions.forEach(

          (
            question,
            index
          ) => {


            output += `

              <p>

                ${index + 1}.

                ${escapeHtml(
                  question
                )}

                <b>

                  (

                  ${escapeHtml(
                    saved.answers[
                      "q" +
                      (index + 1)
                    ]
                  )}

                  /

                  5

                  )

                </b>

              </p>

            `;

          }

        );


      } else {


        const definition =

          activityDefinitions[
            activity.id
          ];


        if (definition) {


          definition.fields.forEach(

            field => {


              output += `

                <p>

                  <b>

                    ${escapeHtml(
                      field[1]
                    )}

                    :

                  </b>

                  <br>

                  ${escapeHtml(

                    saved.answers?.[
                      field[0]
                    ] || ""

                  )}

                </p>

              `;

            }

          );

        }

      }


      output +=
        "</div>";

    }



    output += `

      <p>

        تنبيه منهجي:
        ${escapeHtml(methodNote)}

      </p>

      </html>

    `;



    const blob =

      new Blob(

        [output],

        {

          type:
            "text/html;charset=utf-8"

        }

      );



    const url =

      URL.createObjectURL(
        blob
      );



    const link =

      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =

      "دفتر_المشارك_الكامل.html";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
      url
    );


  } catch (error) {


    alert(

      "تعذر تحميل الدفتر: " +
      error.message

    );

  }

}
