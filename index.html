/* ========================================

   تنظيف النصوص

======================================== */


function escapeHtml(value) {

  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  );

}



/* ========================================

   استدعاء API

======================================== */


async function apiCall(body) {


  const response = await fetch(

    API_URL,

    {

      method:
        "POST",

      headers: {

        "Content-Type":
          "application/json"

      },

      body:
        JSON.stringify(body)

    }

  );


  let data = {};


  try {

    data =
      await response.json();

  } catch {}


  if (!response.ok) {

    throw new Error(

      data.error ||

      data.message ||

      "تعذر الاتصال بالنظام."

    );

  }


  return data;

}



/* ========================================

   تفسير الدرجات

======================================== */


function interpretScore(score) {


  if (score >= 17) {

    return [

      "ممارسة راسخة",

      "حافظ عليها، وانقلها إلى زملائك وفريقك."

    ];

  }


  if (score >= 12) {

    return [

      "ممارسة موجودة لكنها غير منتظمة",

      "اجعلها عادة: موعد ثابت، ومسؤول واضح، وأداة بسيطة."

    ];

  }


  return [

    "فرصة تحسين أولى",

    "ابدأ منها في عيادة الرشاقة بأصغر تحسين ممكن."

  ];

}



/* ========================================

   حساب الاستبانة

======================================== */


function calculateAssessment(
  answers
) {


  const values = [];


  for (
    let i = 1;
    i <= 16;
    i++
  ) {

    values.push(

      Number(
        answers["q" + i]
      )

    );

  }


  const dimensionNames = [

    "الوضوح",

    "المرونة",

    "التكامل",

    "التعلّم"

  ];


  const dimensions =

    dimensionNames.map(

      (
        name,
        index
      ) => {


        const score =

          values

          .slice(
            index * 4,
            index * 4 + 4
          )

          .reduce(
            (a, b) => a + b,
            0
          );


        const [

          label,

          advice

        ] = interpretScore(
          score
        );


        return {

          name,

          score,

          label,

          advice

        };

      }

    );


  const sorted =

    [...dimensions]

    .sort(
      (a, b) =>
        b.score - a.score
    );


  return {

    total:

      dimensions.reduce(
        (total, item) =>
          total + item.score,
        0
      ),

    maxTotal:
      80,

    dimensions,

    strongest:
      sorted[0].name,

    weakest:
      sorted[
        sorted.length - 1
      ].name

  };

}



/* ========================================

async function login() {


  const name =

    getElement(
      "participantName"
    ).value.trim();


  const email =

    getElement(
      "participantEmail"
    ).value.trim();


  const message =

    getElement(
      "loginMessage"
    );


  if (
    !name ||
    !email
  ) {

    message.className =
      "error";

    message.textContent =

      "الاسم والبريد الإلكتروني مطلوبان.";

    return;

  }


  message.className =
    "muted";


  message.textContent =
    "جارٍ الدخول...";


  try {


    const result =

      await apiCall({

        action:
          "register",

        name,

        email

      });


    accessToken =
      result.token;


    localStorage.setItem(

      "waqf_workbook_token",

      accessToken

    );


    await loadStatus();


  } catch (error) {


    message.className =
      "error";


    message.textContent =

      "تعذر الدخول: " +
      error.message;

  }

}



/* ========================================

   تحميل حالة المشارك

======================================== */


async function loadStatus() {


  try {


    appState =

      await apiCall({

        action:
          "status",

        token:
          accessToken

      });


    getElement(
      "loginScreen"
    ).classList.add(
      "hidden"
    );


    getElement(
      "workbookApp"
    ).classList.remove(
      "hidden"
    );


    getElement(
      "currentParticipant"
    ).textContent =

      appState.participant.name;


    currentActivity =

      Number(

        appState.current_activity
        || 1

      );


    render();


  } catch (error) {


    localStorage.removeItem(
      "waqf_workbook_token"
    );


    accessToken = "";


    getElement(
      "workbookApp"
    ).classList.add(
      "hidden"
    );


    getElement(
      "loginScreen"
    ).classList.remove(
      "hidden"
    );


    getElement(
      "loginMessage"
    ).className =
      "error";


    getElement(
      "loginMessage"
    ).textContent =

      "تعذر استعادة الجلسة. سجّل الدخول مرة أخرى.";

  }

}

   الإجابات المحفوظة

======================================== */


function savedResponses() {


  const map = {};


  (
    appState.saved || []
  ).forEach(

    response => {

      map[
        response.activity_id
      ] = response;

    }

  );


  return map;

}



/* ========================================

   عرض الأنشطة

======================================== */


function render() {


  const saved =
    savedResponses();


  const steps =

    getElement(
      "activitySteps"
    );


  steps.innerHTML = "";


  (
    appState.activities || []
  ).forEach(

    activity => {


      const button =

        document.createElement(
          "button"
        );


      button.type =
        "button";


      button.className =
        "step";


      if (
        Number(activity.id) ===
        Number(currentActivity)
      ) {

        button.classList.add(
          "current"
        );

      }


      if (
        saved[activity.id]
      ) {

        button.classList.add(
          "done"
        );

      }


      if (
        !activity.is_open
      ) {

        button.classList.add(
          "locked"
        );

      }


      button.textContent =

        saved[activity.id]
        ? "✓"
        : activity.id;


      button.title =
        activity.title;


      if (
        activity.is_open
      ) {


        button.onclick = () => {


          currentActivity =
            Number(activity.id);


          render();

        };

      }


      steps.appendChild(
        button
      );

    }

  );


  const activity =

    (
      appState.activities || []
    )

    .find(

      item =>

        Number(item.id) ===
        Number(currentActivity)

    );


  if (!activity) {

    getElement(
      "activityContent"
    ).innerHTML =

      "<p>لا يوجد نشاط متاح حاليًا.</p>";

    return;

  }


  getElement(
    "activityStatus"
  ).innerHTML =

    activity.is_open

    ? "<b>النشاط " +
      activity.id +
      " مفتوح الآن.</b>"

    : "هذا النشاط غير مفتوح حاليًا. انتظر توجيه المدرب.";



  if (
    Number(activity.id) === 1
  ) {


    renderAssessment(
      saved[1]
    );


  } else {


    renderRegularActivity(

      activity,

      saved[activity.id]

    );

  }

}



/* ========================================

   عرض الاستبانة

======================================== */


function renderAssessment(
  saved
) {


  const existing =

    saved?.answers || {};


  if (
    existing._result
  ) {


    renderAssessmentResult(
      existing._result
    );


    return;

  }


  const labels = [

    "نادرًا",

    "قليلًا",

    "أحيانًا",

    "غالبًا",

    "دائمًا"

  ];


  let html = `

    <div class="activity-number">
      المهمة الأولى
    </div>

    <h2>
      استبانة رشاقة الأداء الفردية
    </h2>

    <p class="muted">

      أين أقف في الوضوح
      والمرونة والتكامل والتعلّم؟

      اختر ما يصف ممارستك
      وبيئة عملك المباشرة
      خلال الأشهر الثلاثة الأخيرة.

    </p>

  `;



  assessmentQuestions.forEach(

    (
      question,
      index
    ) => {


      const number =
        index + 1;


      html += `

        <div class="question">

          <b>

            ${number}.
            ${escapeHtml(question)}

          </b>


          <div class="scale">

      `;



      labels.forEach(

        (
          label,
          choiceIndex
        ) => {


          const value =
            choiceIndex + 1;


          const checked =

            Number(
              existing[
                "q" + number
              ]
            ) === value

            ? "checked"

            : "";


          html += `

            <label class="choice">

              <input
                type="radio"
                name="q${number}"
                value="${value}"
                ${checked}
              >

              ${value}
              —
              ${label}

            </label>

          `;

        }

      );


      html += `

          </div>

        </div>

      `;

    }

  );


  html += `

    <div class="actions">

      <button
        id="saveAssessmentButton"
        class="button"
        type="button"
      >

        احسب نتيجتي واحفظها

      </button>

    </div>


    <p
      id="saveMessage"
    ></p>


    <p class="method-note">

      أداة تأمل ذاتي وليست
      مقياسًا محكمًا،
      ولا تستخدم لتقييم الأشخاص
      أو مقارنة الجهات
      أو اتخاذ قرارات إدارية.

    </p>

  `;


  getElement(
    "activityContent"
  ).innerHTML =
    html;


  getElement(
    "saveAssessmentButton"
  ).onclick =
    saveAssessment;

}



/* ========================================

   حفظ الاستبانة

======================================== */


async function saveAssessment() {


  const answers = {};


  const message =

    getElement(
      "saveMessage"
    );


  for (
    let i = 1;
    i <= 16;
    i++
  ) {


    const selected =

      document.querySelector(

        `input[name="q${i}"]:checked`

      );


    if (!selected) {


      message.className =
        "error";


      message.textContent =

        "أجب عن جميع العبارات أولًا.";


      return;

    }


    answers[
      "q" + i
    ] =

      Number(
        selected.value
      );

  }


  const result =

    calculateAssessment(
      answers
    );


  answers._result =
    result;


  message.className =
    "muted";


  message.textContent =
    "جارٍ الحفظ...";


  try {


    await apiCall({

      action:
        "save",

      token:
        accessToken,

      activity_id:
        1,

      answers

    });


    await loadStatus();


  } catch (error) {


    message.className =
      "error";


    message.textContent =

      "تعذر الحفظ: " +
      error.message;

  }

}



/* ========================================

   شاشة نتيجة الاستبانة

======================================== */


function renderAssessmentResult(
  result
) {


  getElement(
    "activityStatus"
  ).innerHTML =

    "<b>اكتملت المهمة الأولى ✓</b>";



  const cards =

    result.dimensions

    .map(

      item => `

        <div class="result-card">

          <b>
            ${escapeHtml(item.name)}
          </b>


          <div class="score">

            ${item.score}
            /
            20

          </div>


          <div class="bar">

            <span
              style="
                width:
                ${(item.score / 20) * 100}%
              "
            ></span>

          </div>


          <b>

            ${escapeHtml(
              item.label
            )}

          </b>


          <div class="muted">

            ${escapeHtml(
              item.advice
            )}

          </div>

        </div>

      `

    )

    .join("");



  getElement(
    "activityContent"
  ).innerHTML = `


    <h2>
      نتيجتك في استبانة الرشاقة
    </h2>


    <div
      class="result-card"
      style="text-align:center"
    >


      <div class="score">

        ${result.total}
        /
        80

      </div>


      <div>

        المجموع الكلي

      </div>


    </div>



    <div
      class="grid"
      style="margin-top:10px"
    >

      ${cards}

    </div>



    <div
      class="notice"
      style="margin-top:14px"
    >

      <b>
        أقوى بُعد:
      </b>

      ${escapeHtml(
        result.strongest
      )}

      <br>

      <b>
        أضعف بُعد:
      </b>

      ${escapeHtml(
        result.weakest
      )}

    </div>


    <p class="muted">

      تم حفظ إجاباتك
      وتحليل النتيجة.

    </p>

  `;

}



/* ========================================

   عرض الأنشطة 2–8

======================================== */


function renderRegularActivity(
  activity,
  saved
) {


  const definition =

    activityDefinitions[
      activity.id
    ];


  if (!definition) {


    getElement(
      "activityContent"
    ).innerHTML =

      "<p class='error'>تعذر العثور على تعريف النشاط.</p>";


    return;

  }


  const existing =

    saved?.answers || {};


  let html = `

    <div class="activity-number">

      النشاط
      ${activity.id}

    </div>


    <h2>

      ${escapeHtml(
        definition.title
      )}

    </h2>


    <p class="muted">

      ${escapeHtml(
        definition.help
      )}

    </p>

  `;



  definition.fields.forEach(

    field => {


      html += `

        <label
          for="field_${field[0]}"
        >

          ${escapeHtml(
            field[1]
          )}

        </label>


        <textarea
          id="field_${field[0]}"
          ${activity.is_open
            ? ""
            : "disabled"}
        >${escapeHtml(
          existing[
            field[0]
          ] || ""
        )}</textarea>

      `;

    }

  );


  html += `

    <div class="actions">

      <button
        id="saveRegularButton"
        class="button"
        type="button"

        ${activity.is_open
          ? ""
          : "disabled"}
      >

        ${saved
          ? "تحديث المشاركة"
          : "حفظ وإرسال"}

      </button>

    </div>


    <p
      id="saveMessage"
    ></p>

  `;


  getElement(
    "activityContent"
  ).innerHTML =
    html;


  if (
    activity.is_open
  ) {


    getElement(
      "saveRegularButton"
    ).onclick = () =>

      saveRegularActivity(
        activity.id
      );

  }

}



/* ========================================

   حفظ نشاط عادي

======================================== */


async function saveRegularActivity(
  activityId
) {


  const definition =

    activityDefinitions[
      activityId
    ];


  const answers = {};


  definition.fields.forEach(

    field => {


      answers[
        field[0]
      ] =

        getElement(
          "field_" +
          field[0]
        ).value.trim();

    }

  );


  const message =

    getElement(
      "saveMessage"
    );


  message.className =
    "muted";


  message.textContent =
    "جارٍ الحفظ...";


  try {


    await apiCall({

      action:
        "save",

      token:
        accessToken,

      activity_id:
        activityId,

      answers

    });


    message.className =
      "success";


    message.textContent =
      "✓ تم الحفظ";


    await loadStatus();


  } catch (error) {


    message.className =
      "error";


    message.textContent =

      "تعذر الحفظ: " +
      error.message;

  }

}



/* ========================================

   تحميل الدفتر الكامل

======================================== */


async function downloadWorkbook() {


  try {


    const data =

      await apiCall({

        action:
          "status",

        token:
          accessToken

      });


    const savedMap = {};


    (
      data.saved || []
    ).forEach(

      response => {

        savedMap[
          response.activity_id
        ] = response;

      }

    );


    let output = `

      <!doctype html>

      <html
        lang="ar"
        dir="rtl"
      >

      <meta charset="utf-8">

      <title>
        دفتر المشارك الكامل
      </title>


      <style>

        body {

          font-family:
            Arial,
            sans-serif;

          max-width:
            900px;

          margin:
            40px auto;

          line-height:
            1.8;

          color:
            #27313D;

        }

        h1,
        h2,
        h3 {

          color:
            #2F4053;

        }

        .box {

          border:
            1px solid #ddd;

          border-radius:
            12px;

          padding:
            16px;

          margin:
            14px 0;

        }

      </style>


      <h1>

        دفتر المشارك الكامل

      </h1>


      <p>

        ${escapeHtml(
          data.participant.name
        )}

        —

        ${escapeHtml(
          data.participant.email
        )}

      </p>

    `;



    for (
      const activity
      of data.activities
    ) {


      const saved =

        savedMap[
          activity.id
        ];


      if (!saved) {

        continue;

      }


      output += `

        <div class="box">

          <h2>

            ${escapeHtml(
              activity.title
            )}

          </h2>

      `;



      if (

        Number(
          activity.id
        ) === 1

        &&

        saved.answers?._result

      ) {


        const result =

          saved.answers._result;


        output += `

          <h3>

            المجموع:

            ${result.total}

            /

            80

          </h3>

        `;



        result.dimensions.forEach(

          dimension => {


            output += `

              <p>

                <b>

                  ${escapeHtml(
                    dimension.name
                  )}

                  :

                  ${dimension.score}
                  /
                  20

                  —

                  ${escapeHtml(
                    dimension.label
                  )}

                </b>

                <br>

                ${escapeHtml(
                  dimension.advice
                )}

              </p>

            `;

          }

        );


        output += `

          <p>

            <b>
              أقوى بُعد:
            </b>

            ${escapeHtml(
              result.strongest
            )}

          </p>


          <p>

            <b>
              أضعف بُعد:
            </b>

            ${escapeHtml(
              result.weakest
            )}

          </p>


          <h3>
            إجابات الاستبانة
          </h3>

        `;



        assessmentQuestions.forEach(

          (
            question,
            index
          ) => {


            output += `

              <p>

                ${index + 1}.

                ${escapeHtml(
                  question
                )}

                <b>

                  (

                  ${escapeHtml(
                    saved.answers[
                      "q" +
                      (index + 1)
                    ]
                  )}

                  /

                  5

                  )

                </b>

              </p>

            `;

          }

        );


      } else {


        const definition =

          activityDefinitions[
            activity.id
          ];


        if (definition) {


          definition.fields.forEach(

            field => {


              output += `

                <p>

                  <b>

                    ${escapeHtml(
                      field[1]
                    )}

                    :

                  </b>

                  <br>

                  ${escapeHtml(

                    saved.answers?.[
                      field[0]
                    ] || ""

                  )}

                </p>

              `;

            }

          );

        }

      }


      output +=
        "</div>";

    }



    output += `

      <p>

        تنبيه منهجي:
        أداة التأمل الذاتي
        ليست مقياسًا محكمًا،
        ولا تستخدم لتقييم الأشخاص
        أو مقارنة الجهات
        أو اتخاذ قرارات إدارية.

      </p>

      </html>

    `;



    const blob =

      new Blob(

        [output],

        {

          type:
            "text/html;charset=utf-8"

        }

      );



    const url =

      URL.createObjectURL(
        blob
      );



    const link =

      document.createElement(
        "a"
      );


    link.href =
      url;


    link.download =

      "دفتر_المشارك_الكامل.html";


    document.body.appendChild(
      link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
      url
    );


  } catch (error) {


    alert(

      "تعذر تحميل الدفتر: " +
      error.message

    );

  }

}
